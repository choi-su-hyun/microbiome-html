<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>##page_1|visible|title_above## ##page_1|visible|title_below##</title>
    <link rel="stylesheet" href="../common/styles/reset.css" />
    <link rel="stylesheet" href="../common/styles/common.css" />
    <link rel="stylesheet" href="../common/styles/print.css" />
    <link rel="stylesheet" href="../common/styles/colors.css" />
    <link rel="stylesheet" href="../common/styles/typography.css" />
    <link rel="stylesheet" href="styles/cover.css" />
  </head>
  <body>
    <main class="cover-page" aria-labelledby="report-title">
      <section class="cover-page__content">
        <p class="cover-page__logo" aria-label="##page_1|visible|report_context|brand##">
          <img src="../common/svgs/logo.svg" alt="##page_1|visible|report_context|brand##" />
        </p>

        <h1 id="report-title" class="cover-page__title">
          ##page_1|visible|title_above## ##page_1|visible|title_below##
        </h1>

        <p class="cover-page__description">
          ##page_1|visible|subtitle_above## ##page_1|visible|subtitle_below##
        </p>

        <dl class="cover-page__metadata" aria-label="분석 정보">
          <div class="cover-page__metadata-row">
            <dt class="type-label-xlarge-strong">분석 일자</dt>
            <dd class="type-label-xlarge">##page_1|visible|report_context|analysis_date##</dd>
          </div>
          <div class="cover-page__metadata-row">
            <dt class="type-label-xlarge-strong">부모 이름</dt>
            <dd class="type-label-xlarge">##page_1|visible|report_context|parent_name##</dd>
          </div>
          <div class="cover-page__metadata-row">
            <dt class="type-label-xlarge-strong">아이 이름</dt>
            <dd class="type-label-xlarge">##page_1|visible|report_context|child_name##</dd>
          </div>
        </dl>
      </section>
    </main>
  </body>
</html>
